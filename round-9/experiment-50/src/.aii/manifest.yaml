entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: cache/
    delete: regenerable
    source: "cd src && ../.venv/bin/python cmap9.py s1 all && ../.venv/bin/python cmap9.py s2 all && ../.venv/bin/python cmap9.py s3 all"
  - path: src/__pycache__/
    delete: regenerable
    source: "python -m compileall src (bytecode is rebuilt on import)"
