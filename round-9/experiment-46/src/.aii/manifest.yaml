entries:
  - path: cache/states/
    keep: activation states (Qwen3-32B nf4 / Qwen3-8B bf16, all manifolds) and frozen geodesic graphs that iteration 10 loads for out-of-sample placement; ~0.5 GB of GPU extraction
  - path: inputs/e44/states/
    delete: regenerable
    source: ".venv/bin/python method.py inputs   # re-copies smean_C6_nf4.npz, geo_C6_nf4.npz, smean_C1_bf16.npz from the iteration-8 artifact art_R-HSmXq2t97f (cache/states/)"
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.lock.txt"
  - path: "**/__pycache__/"
    delete: regenerable
    source: "created automatically by python on import"
