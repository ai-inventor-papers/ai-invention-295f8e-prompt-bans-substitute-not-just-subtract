[project]
name = "s0-iter9-record-repair"
version = "0.1.0"
description = "Iteration-9 Step 0: repair of the iteration-8 research record (corrections, lint, alias-overlap geometry)"
requires-python = "==3.12.*"
# Every package installed in .venv, pinned to the exact version used for the published results
# (from `uv pip freeze --python .venv/bin/python`; the uv venv has no pip executable).
