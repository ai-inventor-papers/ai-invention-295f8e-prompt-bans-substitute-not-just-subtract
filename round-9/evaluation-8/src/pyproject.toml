    "anyio==4.15.1",
    "click==8.5.0",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "filelock==4.2.4",
    "fonttools==4.67.0",
    "fsspec==2026.9.0",
    "h11==0.16.0",
    "hf-xet==1.7.0",
    "httpcore2==2.16.0",
    "httpx2==2.16.0",
    "huggingface-hub==2.3.0",
    "idna==3.20",
    "kiwisolver==1.5.1",
    "loguru==0.7.3",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "packaging==26.3",
    "pillow==13.0.0",
    "pyparsing==3.3.3",
    "python-dateutil==3.0.0",
    "pyyaml==6.0.3",
    "scipy==1.18.1",
    "six==1.17.0",
    "tokenizers==0.23.3",
    "tqdm==4.70.1",
    "truststore==0.10.5",
    "typing-extensions==4.16.0",
    "tzdata==2026.5",
