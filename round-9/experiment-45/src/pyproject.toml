[project]
name = "tpb-banned-coders-rename"
version = "1.0.0"
description = "Iteration 9 TP-B: do models obey a five-name algorithm ban on names rather than on mechanisms? Gated expansion-order tracer on the T1 grid-path task, retrace of iteration 1-8 ban rows, cumulative bans k=1..5, described ban, rotated sets."
requires-python = "==3.12.*"
# Every package installed in .venv, pinned to the installed version (`uv pip freeze --python .venv/bin/python`).
# Direct imports: numpy, scipy, pandas, matplotlib, loguru, aiohttp, zss, networkx, pyyaml; the rest are their dependencies.
dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.5",
    "aiosignal==1.4.0",
    "attrs==26.1.0",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "fonttools==4.67.0",
    "frozenlist==1.8.0",
    "idna==3.20",
    "kiwisolver==1.5.1",
    "loguru==0.7.3",
    "matplotlib==3.11.2",
    "multidict==7.1.0",
    "networkx==3.7",
    "numpy==2.5.4",
    "packaging==26.3",
    "pandas==3.1.0",
    "pillow==13.0.0",
    "propcache==0.5.4",
    "pyparsing==3.3.3",
    "python-dateutil==3.0.0",
    "pyyaml==6.0.3",
    "scipy==1.18.1",
    "six==1.17.0",
    "typing-extensions==4.16.0",
    "tzdata==2026.5",
    "yarl==1.25.1",
    "zss==1.2.0",
]
