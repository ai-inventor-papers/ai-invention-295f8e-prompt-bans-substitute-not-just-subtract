entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.txt"
  - path: .cache/
    delete: regenerable
    source: ".venv/bin/python method.py stage1   # vLLM / Triton / XDG caches are recreated under .cache/ by the next GPU job"
  - path: exposure/__pycache__/
    delete: regenerable
    source: ".venv/bin/python method.py --help   # bytecode is recreated on import"
  - path: analysis/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m pytest tests/   # bytecode is recreated on import"
  - path: tests/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m pytest tests/"
  - path: bench_copy/__pycache__/
    delete: regenerable
    source: ".venv/bin/python method.py --help"
  - path: bench_copy/common/__pycache__/
    delete: regenerable
    source: ".venv/bin/python method.py --help"
