entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.txt"
  - path: src/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall -q src"
  - path: inputs/bench/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall -q inputs/bench"
  - path: inputs/bench/common/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall -q inputs/bench/common"
