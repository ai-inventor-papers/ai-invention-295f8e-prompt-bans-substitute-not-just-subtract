entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.lock.txt"
  - path: "**/__pycache__/"
    delete: regenerable
    source: "uv run eval.py --section no_judges (Python recreates bytecode caches on import)"
