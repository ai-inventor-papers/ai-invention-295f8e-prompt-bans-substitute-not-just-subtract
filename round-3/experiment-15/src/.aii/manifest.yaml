entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: __pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall -q method.py"
  - path: src/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall -q src"
  - path: tests/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall -q tests"
  - path: screen10/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall -q screen10"
  - path: screen10/canon/gen/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall -q screen10/canon/gen"
  - path: screen10/canon/labeller/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall -q screen10/canon/labeller"
  - path: screen10/canon/tasks/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall -q screen10/canon/tasks"
