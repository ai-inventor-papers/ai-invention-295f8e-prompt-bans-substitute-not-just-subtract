entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.txt"
  - path: __pycache__/
    delete: regenerable
    source: "recreated automatically by Python on import (python -m compileall method.py)"
  - path: "**/__pycache__/"
    delete: regenerable
    source: "recreated automatically by Python on import (python -m compileall src)"
