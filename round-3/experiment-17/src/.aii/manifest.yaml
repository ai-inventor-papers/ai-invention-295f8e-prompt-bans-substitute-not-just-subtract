entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: states/
    keep: GPU teacher-forced fp16 residual states (C2e decoders, 5a SAE codes, 5c manifold, archive power boost); about 30 min of GPU to regenerate
  - path: directions/
    keep: the committed prohibition directions, norms, random directions and S2 diagnostic arrays (hash-chained in commitments.log)
