entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: states/
    delete: regenerable
    source: ".venv/bin/python method.py hooks"
  - path: __pycache__/
    delete: regenerable
    source: "python bytecode, rebuilt automatically on import"
  - path: "*/__pycache__/"
    delete: regenerable
    source: "python bytecode, rebuilt automatically on import"
