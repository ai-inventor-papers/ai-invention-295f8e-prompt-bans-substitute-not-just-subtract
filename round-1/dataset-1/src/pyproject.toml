[project]
name = "algorithm-choice-bench-data"
version = "0.1.0"
description = "Standardised source data for a Python algorithm-choice coding bench (AI Inventor artifact gen_art_dataset_1)"
requires-python = ">=3.12,<3.13"
# Every package installed in .venv, pinned to the exact installed version
# (`uv pip freeze --python .venv/bin/python`; the uv venv has no pip). Python used: 3.12.14.
# data.py is a uv inline script: its PEP 723 header pins the same versions of the three packages it imports
# (loguru, tokenizers, huggingface-hub) and runs in its own environment.
dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.5",
    "aiosignal==1.4.0",
    "anyio==4.15.1",
    "attrs==26.1.0",
    "certifi==2026.10.18",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "datasets==5.1.0",
    "dill==0.4.1",
    "filelock==4.2.4",
    "frozenlist==1.8.0",
    "fsspec==2026.7.0",
    "h11==0.16.0",
    "hf-xet==1.7.0",
    "httpcore==1.0.9",
    "httpcore2==2.14.0",
    "httpx==0.28.1",
    "httpx2==2.14.0",
    "huggingface-hub==2.2.0",
    "idna==3.20",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "loguru==0.7.3",
    "multidict==7.1.0",
    "multiprocess==0.70.19",
    "numpy==2.5.4",
    "packaging==26.3",
    "pandas==3.0.6",
    "propcache==0.5.4",
    "pyarrow==26.0.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "requests==2.34.2",
    "rpds-py==2026.9.1",
    "six==1.17.0",
    "tokenizers==0.23.3",
    "tqdm==4.70.1",
    "truststore==0.10.5",
    "typing-extensions==4.16.0",
    "urllib3==2.8.0",
    "xxhash==4.0.2",
    "yarl==1.25.1",
]

[tool.uv]
package = false
