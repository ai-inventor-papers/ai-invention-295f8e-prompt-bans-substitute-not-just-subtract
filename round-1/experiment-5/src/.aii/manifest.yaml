entries:
  - path: .venv/
    delete: regenerable
    source: "./install.sh   # = uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: src/__pycache__/
    delete: regenerable
    source: "python -m compileall src"
  - path: activations/
    keep: residual-stream states (base/instruct at R and teacher-forced positions), paired deltas and band steering vectors; read by the next iteration's pooled evaluation
