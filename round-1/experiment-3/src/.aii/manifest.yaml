entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.txt"
  - path: scratch/
    delete: regenerable
    source: "label cache and temp files are rebuilt by: .venv/bin/python method.py --phase gen1 (and gen2)"
  - path: states/
    keep: residual-stream activation states (G1+G2 samples, 8 positions x 21 layers x 4096, float16) for the pooled locus analyses next round; ~1 GB of GPU-extracted states
  - path: generations/
    keep: every labelled generation of the screen (~10k rows), the record all analyses read; GPU-hours to regenerate
