entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: src/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall -q src"
  - path: vendor/**/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall -q vendor"
