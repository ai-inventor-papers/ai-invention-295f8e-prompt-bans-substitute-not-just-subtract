entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: .venv_ct/
    delete: regenerable
    source: "uv venv .venv_ct --python=3.12 && uv pip install --python .venv_ct/bin/python 'circuit-tracer @ git+https://github.com/safety-research/circuit-tracer@255d989e93be1299d53d67b59e9fd76a0e274b14' ziglang==0.17.0"
  - path: src/__pycache__/
    delete: regenerable
    source: "created automatically by any Python run of method.py"
  - path: cache/states/
    keep: fork-position residual states (all 34 blocks) of the 120 twin variants, 40 forced sources and 5 twins plus the G1 selection and validation rows; needed to re-fit DAS and redraw the geometry figure without the GPU (about 50 GPU-minutes to rebuild)
