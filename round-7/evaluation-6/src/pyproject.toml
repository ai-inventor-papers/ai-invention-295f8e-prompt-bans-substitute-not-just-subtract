[project]
name = "record-repair-iter7"
version = "0.1.0"
description = "Iteration-7 Step 0: number-by-number repair of the run report from raw rows of four iteration-6 experiments"
requires-python = "==3.12.*"
# every package installed in .venv, pinned to the exact version (from `uv pip freeze`; the venv has no pip)
dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.5",
    "aiosignal==1.4.0",
    "attrs==26.1.0",
    "frozenlist==1.8.0",
    "idna==3.20",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "loguru==0.7.3",
    "multidict==7.1.0",
    "numpy==2.5.4",
    "propcache==0.5.4",
    "pypdf==6.21.2",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "rpds-py==2026.9.1",
    "scipy==1.18.1",
    "six==1.17.0",
    "typing-extensions==4.16.0",
    "yarl==1.25.1",
    "zss==1.2.0",
]
