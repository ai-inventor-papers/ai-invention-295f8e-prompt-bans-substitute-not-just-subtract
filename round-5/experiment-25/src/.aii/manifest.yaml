entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.lock.txt"
  - path: "**/__pycache__/"
    delete: regenerable
    source: "created automatically by Python when the code runs"
  - path: .pytest_cache/
    delete: regenerable
    source: ".venv/bin/python -m pytest -c pytest.ini tests"
