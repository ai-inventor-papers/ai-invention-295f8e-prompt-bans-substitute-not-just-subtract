[project]
name = "iter5-fix-record-freeze-rivals"
version = "0.1.0"
description = "Iteration-5 Step 0: record corrections (0a)-(0h) and frozen rival task predictors (0i), CPU only"
requires-python = ">=3.12,<3.13"
# Every package installed in .venv, pinned to the exact installed version (from `uv pip freeze --python .venv/bin/python`;
# the uv-created venv has no pip).  Direct dependencies: numpy, scipy, loguru, requests, pyyaml, aiohttp, matplotlib;
# the rest are their transitive dependencies.  The same list is in requirements.lock.txt.
dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.12.13",
    "aiosignal==1.4.0",
    "attrs==26.1.0",
    "certifi==2026.10.19",
    "charset-normalizer==3.5.2",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "fonttools==4.67.0",
    "frozenlist==1.8.0",
    "idna==3.20",
    "kiwisolver==1.5.1",
    "loguru==0.7.3",
    "matplotlib==3.10.3",
    "multidict==6.9.1",
    "numpy==2.2.6",
    "packaging==26.3",
    "pillow==13.0.0",
    "propcache==0.5.4",
    "pyparsing==3.3.3",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.2",
    "requests==2.32.4",
    "scipy==1.15.3",
    "six==1.17.0",
    "typing-extensions==4.16.0",
    "urllib3==2.8.0",
    "yarl==1.25.1",
]
