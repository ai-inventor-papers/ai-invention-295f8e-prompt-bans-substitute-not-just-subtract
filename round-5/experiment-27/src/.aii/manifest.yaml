entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: .venv_vllm/
    delete: regenerable
    source: "uv venv .venv_vllm --python=3.12 && uv pip install --python .venv_vllm/bin/python -r env/requirements_vllm.txt"
  - path: audit/__pycache__/
    delete: regenerable
    source: "re-run any script of this folder (Python recreates its bytecode cache), or python -m compileall src audit inputs"
