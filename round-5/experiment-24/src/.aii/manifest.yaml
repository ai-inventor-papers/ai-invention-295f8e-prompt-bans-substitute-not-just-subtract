entries:
  - path: cache/states/
    keep: exact bf16 prefill states of both models at all 36 blocks (150 files, ~6.3 GB); every transplant was built from them; kept on the run volume, never published
  - path: cache/geometry/
    keep: forced-prompt and hooked-prefill geometry vectors behind results/geometry.json (GPU outputs of this run); kept on the run volume
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: .venv_vllm/
    delete: regenerable
    source: "uv venv .venv_vllm --python 3.12 && uv pip install --python .venv_vllm/bin/python vllm==0.11.0 transformers==4.57.6 tokenizers==0.22.2 loguru==0.7.3"
  - path: "**/__pycache__/"
    delete: regenerable
    source: "python -m compileall src (created automatically on import)"
