entries:
  - path: states/
    keep: teacher-forced residual activations (layers 20-28; R, g8, g16, g32, pre) of every scored program, about 0.95 GB in parts under 90 MB; regenerating needs about 10 GPU-minutes and the exact program sets; stays on the run volume, excluded from the published repository
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: __pycache__/
    delete: regenerable
    source: "uv run python -m compileall -q -l method.py common.py"
  - path: mb/__pycache__/
    delete: regenerable
    source: "uv run python -m compileall -q mb"
  - path: analysis/__pycache__/
    delete: regenerable
    source: "uv run python -m compileall -q analysis"
  - path: tasks/__pycache__/
    delete: regenerable
    source: "uv run python -m compileall -q tasks"
