entries:
  - path: .venv/
    delete: regenerable
    source: "./restore.sh  (uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.lock.txt)"
  - path: work/
    delete: regenerable
    source: "./restore.sh --with-c5-cache  (.venv/bin/python method.py s7)"
  - path: __pycache__/
    delete: regenerable
    source: "python -m compileall .  (Python bytecode, also rebuilt automatically on import)"
  - path: tests/__pycache__/
    delete: regenerable
    source: "python -m compileall .  (Python bytecode, also rebuilt automatically on import)"
  - path: suite/__pycache__/
    delete: regenerable
    source: "python -m compileall .  (Python bytecode, also rebuilt automatically on import)"
  - path: suite/labeller/__pycache__/
    delete: regenerable
    source: "python -m compileall .  (Python bytecode, also rebuilt automatically on import)"
  - path: suite/tasks/__pycache__/
    delete: regenerable
    source: "python -m compileall .  (Python bytecode, also rebuilt automatically on import)"
