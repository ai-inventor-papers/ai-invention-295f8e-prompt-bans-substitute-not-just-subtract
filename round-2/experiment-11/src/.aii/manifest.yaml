entries:
  - path: .venv/
    delete: regenerable
    source: "bash restore.sh  (= uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.txt)"
  - path: .cache/
    delete: regenerable
    source: "recreated automatically by the next GPU job (.venv/bin/python method.py gen --job A): VLLM_CACHE_ROOT, TRITON_CACHE_DIR and XDG_CACHE_HOME point under .cache/"
  - path: bench/__pycache__/
    delete: regenerable
    source: "python bytecode, recreated on import: .venv/bin/python method.py --help"
  - path: bench/common/__pycache__/
    delete: regenerable
    source: "python bytecode, recreated on import: .venv/bin/python method.py --help"
  - path: scripts/__pycache__/
    delete: regenerable
    source: "python bytecode, recreated on import: .venv/bin/python -c \"import importlib.util as u; s=u.spec_from_file_location('m','scripts/rederive_headlines.py'); u.module_from_spec(s)\""
