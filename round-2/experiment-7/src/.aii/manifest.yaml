entries:
  - path: .venv/
    delete: regenerable
    source: "uv sync --python 3.12"
  - path: src/__pycache__/
    delete: regenerable
    source: "uv run python -m compileall -q src audit"
  - path: audit/__pycache__/
    delete: regenerable
    source: "uv run python -m compileall -q src audit"
