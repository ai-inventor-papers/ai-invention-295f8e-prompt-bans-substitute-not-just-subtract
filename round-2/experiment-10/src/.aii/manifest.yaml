entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: src/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall -q src"
  - path: canon/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall -q canon"
  - path: canon/tasks/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall -q canon/tasks"
  - path: canon/gen/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall -q canon/gen"
  - path: canon/labeller/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall -q canon/labeller"
