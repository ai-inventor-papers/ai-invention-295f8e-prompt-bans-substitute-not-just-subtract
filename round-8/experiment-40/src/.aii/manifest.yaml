entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: cache/
    delete: regenerable
    source: ".venv/bin/python src/run_dec.py --unit T10 && .venv/bin/python src/run_dec.py --unit GRID && .venv/bin/python src/run_band.py"
  - path: inputs/
    keep: frozen sha256-hashed copies of earlier iterations' prompts, bench, labellers, maps and push directions that the code reads; several upstream iterations are already purged
  - path: src/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall src"
