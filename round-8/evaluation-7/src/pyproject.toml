[project]
name = "record-repair-iter8"
version = "0.1.0"
description = "Iteration-8 Step 0: erratum and re-derivation pass over the iteration-7 record (items 0a-0k)"
requires-python = "==3.12.*"
# every package installed in .venv, pinned to the exact version (from `uv pip freeze`; the uv venv has no pip)
dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.5",
    "aiosignal==1.4.0",
    "attrs==26.1.0",
    "frozenlist==1.8.0",
    "idna==3.20",
    "loguru==0.7.3",
    "multidict==7.1.0",
    "numpy==2.5.4",
    "propcache==0.5.4",
    "pyyaml==6.0.3",
    "tenacity==9.2.1",
    "typing-extensions==4.16.0",
    "yarl==1.25.1",
]
