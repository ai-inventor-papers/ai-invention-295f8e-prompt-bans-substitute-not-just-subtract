entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: cache/states/
    keep: residual-stream states (Qwen3-32B nf4 forced/ban prompts and per-program M2 states; Qwen3-8B bf16/int8/nf4 quantisation check) behind every geometry number; about one GPU-hour on a 16 GB card to regenerate
  - path: src/__pycache__/
    delete: regenerable
    source: "uv run python -m compileall src"
  - path: vendor/exp9/tasks/__pycache__/
    delete: regenerable
    source: "uv run python -m compileall vendor"
  - path: vendor/exp9/labeller_ext/__pycache__/
    delete: regenerable
    source: "uv run python -m compileall vendor"
