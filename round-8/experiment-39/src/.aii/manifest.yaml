entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: cache/known_index.pkl
    delete: regenerable
    source: ".venv/bin/python src/novelty8.py index"
  - path: "**/__pycache__/"
    delete: regenerable
    source: ".venv/bin/python -m compileall -q src inputs build"
