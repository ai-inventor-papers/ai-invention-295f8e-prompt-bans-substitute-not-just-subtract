entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -r requirements.txt"
  - path: .cache/
    delete: regenerable
    source: "bash start_vllm.sh compile   # vLLM torch.compile / Triton / inductor caches are rebuilt on server start"
  - path: src/__pycache__/
    delete: regenerable
    source: "python -m compileall src   # or simply run any src/*.py script"
  - path: tests/__pycache__/
    delete: regenerable
    source: "python -m compileall tests"
  - path: audit/__pycache__/
    delete: regenerable
    source: "python -m compileall audit"
  - path: data/
    keep: search rows, raw requests with top-20 log probs, probe decisions (probe_decisions.bin) and references; the LLM searches are not bit-reproducible
