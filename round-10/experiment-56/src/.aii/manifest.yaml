entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: src/__pycache__/
    delete: regenerable
    source: "python -m compileall src (or rebuilt automatically on import)"
  - path: inputs/**/__pycache__/
    delete: regenerable
    source: "rebuilt automatically when the vendored iteration-9 code and labellers are imported"
  - path: cache/
    keep: GPU-captured fork states of Qwen3-8B / Qwen3-8B-Base / Gemma-3-4b it+pt (h_pre, h_fin, MLP I/O, fp32 fork logits) and the residual PCA basis read by every W1/W2/W3 analysis, figure and the delta-geometry step
  - path: results/
    keep: all results of this run, including the hash-chained null row draws (null_draws_*.npz) that COMMIT 1 registered before W1 scoring
