entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: vllm_cache/
    delete: regenerable
    source: "bash start_vllm.sh  # vLLM/Triton rebuild their compile caches on first start"
  - path: src/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall src"
  - path: data/
    keep: raw rows, completion ids and decision vectors of the 22,000-call search plus probes, corpus and ab grid; GPU sampling is not bit-reproducible
  - path: results/
    keep: every analysis and verdict (V1-V6, clusters, judges, re-derivation) read by later steps
  - path: predictions/
    keep: hash-chained commitments that precede the samples they govern
  - path: figures/
    keep: F1-F8 figures (PDF + PNG)
  - path: logs/
    keep: run logs and time ledger
  - path: method_out.json
    keep: exp_gen_sol_out output read by later steps
  - path: full_method_out.json
    keep: full variant of method_out.json read by later steps
