entries:
  - path: cache/states_v10/
    keep: new teacher-forced program states (Qwen3-8B bf16, Qwen3-32B NF4, RANDNET) and G2 frame coordinates; inputs to later rounds, ~50 GPU-minutes to rebuild
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.lock.txt"
  - path: src/__pycache__/
    delete: regenerable
    source: "regenerated by any `.venv/bin/python method.py <stage>` run (Python bytecode cache)"
  - path: audit/__pycache__/
    delete: regenerable
    source: "regenerated by `python3 audit/rederive_g2.py` (Python bytecode cache)"
  - path: vendor/exp9/tasks/__pycache__/
    delete: regenerable
    source: "regenerated by `.venv/bin/python method.py tests` (Python bytecode cache)"
