[project]
name = "tpg2-mechanism-vs-surface"
version = "1.0.0"
description = "Iteration 10 TP-G2: factorial discipline x container grid-search programs; RSA (G1) and survivor placement (G2) on the frozen Qwen3-8B / Qwen3-32B M-code geometry."
requires-python = "==3.12.*"
