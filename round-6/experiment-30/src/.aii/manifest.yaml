entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: src/__pycache__/
    delete: regenerable
    source: "regenerated automatically by any python run of src/ (e.g. .venv/bin/python method.py cputests)"
  - path: cache/
    keep: bf16 twin, forced-prompt, push and code-opening activation states (GPU-derived; stays on the run volume)
  - path: inputs/
    keep: read-only copies of earlier-artifact inputs with SHA256SUMS (provenance of every number)
