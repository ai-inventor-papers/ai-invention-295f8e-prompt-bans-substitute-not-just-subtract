entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: src/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall src"
  - path: predictions/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall predictions"
  - path: inputs/exp11/bench/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall inputs/exp11/bench"
  - path: inputs/exp11/bench/common/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall inputs/exp11/bench/common"
  - path: inputs/exp8/suite/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall inputs/exp8/suite"
  - path: inputs/exp8/suite/labeller/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall inputs/exp8/suite/labeller"
  - path: inputs/exp8/suite/tasks/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall inputs/exp8/suite/tasks"
