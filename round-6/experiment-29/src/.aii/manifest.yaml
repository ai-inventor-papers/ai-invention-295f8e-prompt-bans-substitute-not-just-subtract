entries:
  - path: .venv/
    delete: regenerable
    source: "uv sync --frozen"
  - path: src/__pycache__/
    delete: regenerable
    source: "uv run src/stage_a.py  (python bytecode cache, recreated by running any script under src/)"
  - path: inputs/exp11/bench/__pycache__/
    delete: regenerable
    source: "uv run src/label_e.py --recheck  (python bytecode cache, recreated when the bench labeller is imported)"
  - path: inputs/exp11/bench/common/__pycache__/
    delete: regenerable
    source: "uv run src/label_e.py --recheck  (python bytecode cache, recreated when the bench labeller is imported)"
  - path: inputs/exp8/suite/__pycache__/
    delete: regenerable
    source: "uv run src/label_e.py --recheck  (python bytecode cache, recreated when the path-task labeller is imported)"
  - path: inputs/exp8/suite/labeller/__pycache__/
    delete: regenerable
    source: "uv run src/label_e.py --recheck  (python bytecode cache, recreated when the path-task labeller is imported)"
  - path: inputs/exp8/suite/tasks/__pycache__/
    delete: regenerable
    source: "uv run src/label_e.py --recheck  (python bytecode cache, recreated when the path-task labeller is imported)"
