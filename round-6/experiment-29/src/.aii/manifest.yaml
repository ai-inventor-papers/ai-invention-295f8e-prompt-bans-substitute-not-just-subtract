entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: src/__pycache__/
    delete: regenerable
    source: "Python bytecode cache, rebuilt automatically on the next import (e.g. .venv/bin/python src/analysis.py)"
  - path: vendor/
    keep: verified copies of the iteration-4/5 code, prompts, directions and inputs this artifact runs on (sha256 in vendor/SHA256SUMS)
