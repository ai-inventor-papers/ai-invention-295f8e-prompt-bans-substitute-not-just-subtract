entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r requirements.lock.txt"
  - path: src/__pycache__/
    delete: regenerable
    source: "uv run python -m compileall -q src  # Python also recreates it on the next import"
  - path: vendor/__pycache__/
    delete: regenerable
    source: "uv run python -m compileall -q vendor  # Python also recreates it on the next import"
  - path: vendor/bench_checkers/__pycache__/
    delete: regenerable
    source: "uv run python -m compileall -q vendor/bench_checkers  # Python also recreates it on the next import"
  - path: scratch/__pycache__/
    delete: regenerable
    source: "uv run python -m compileall -q scratch  # Python also recreates it on the next import"
