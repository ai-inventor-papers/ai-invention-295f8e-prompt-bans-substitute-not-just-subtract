entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml"
  - path: cache/states/
    keep: teacher-forced S3 states, 120 variant and 115 contrast-prompt states, SAE feature selection and DAS subspaces (about 1.6 GB); re-extraction needs about 45 GPU-minutes and every S6-S11 analysis reads them
  - path: __pycache__/
    delete: regenerable
    source: "created automatically by any python run of method.py"
  - path: src/__pycache__/
    delete: regenerable
    source: "created automatically by any python run of method.py"
  - path: inputs/exp8/suite/__pycache__/
    delete: regenerable
    source: "created automatically when the frozen exp8 labeller is imported"
  - path: inputs/exp8/suite/labeller/__pycache__/
    delete: regenerable
    source: "created automatically when the frozen exp8 labeller is imported"
  - path: inputs/exp8/suite/tasks/__pycache__/
    delete: regenerable
    source: "created automatically when the frozen exp8 labeller is imported"
  - path: inputs/exp11/bench/__pycache__/
    delete: regenerable
    source: "created automatically when the frozen exp11 bench labeller is imported"
  - path: inputs/exp11/bench/common/__pycache__/
    delete: regenerable
    source: "created automatically when the frozen exp11 bench labeller is imported"
