entries:
- path: .venv/
  delete: regenerable
  source: uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python -r pyproject.toml
- path: src/__pycache__/
  delete: regenerable
  source: python byte-code cache; recreated automatically by any `uv run method.py <stage>`
